<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F5F4F0"/><rect width="1920" height="12" fill="#2D676A"/><text x="80" y="70" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="700" fill="#2D676A" letter-spacing="2.8">KJM COFFEE SHOP  |  SYSTEM DESIGN</text><text x="80" y="132" font-family="Aptos,Arial,sans-serif" font-size="44" font-weight="700" fill="#20272D">System Features &amp; Modules</text><text x="80" y="171" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#68747A">Implemented customer, staff, rider and administration capabilities</text><text x="1840" y="83" text-anchor="end" font-family="Aptos,Arial,sans-serif" font-size="20" font-weight="700" fill="#68747A">SLIDE 12</text><line x1="90" y1="232" x2="610" y2="232" stroke="#D6D9D5" stroke-width="2"/><text x="90" y="260" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">01</text><text x="138" y="260" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Authentication &amp; User Management</text><text x="138" y="291" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Role-based Admin, Staff, Customer and Rider access.</text><text x="138" y="314" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Customer registration, Google sign-in and profile.</text><line x1="90" y1="386" x2="610" y2="386" stroke="#D6D9D5" stroke-width="2"/><text x="90" y="414" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">02</text><text x="138" y="414" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Admin Dashboard &amp; Management</text><text x="138" y="445" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Manage users, catalog, orders, payments, rewards,</text><text x="138" y="468" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">memberships, banners, shop settings and support.</text><line x1="90" y1="540" x2="610" y2="540" stroke="#D6D9D5" stroke-width="2"/><text x="90" y="568" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">03</text><text x="138" y="568" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Customer Mobile Application</text><text x="138" y="599" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Browse menu and promotions; use favorites and cart.</text><text x="138" y="622" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Save addresses and place pickup or delivery orders.</text><line x1="90" y1="694" x2="610" y2="694" stroke="#D6D9D5" stroke-width="2"/><text x="90" y="722" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">04</text><text x="138" y="722" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Staff POS &amp; Order Management</text><text x="138" y="753" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Create walk-in/POS orders and process the order queue.</text><text x="138" y="776" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Update statuses and assign eligible riders.</text><line x1="90" y1="848" x2="610" y2="848" stroke="#D6D9D5" stroke-width="2"/><text x="90" y="876" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">05</text><text x="138" y="876" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Rider Mobile Application</text><text x="138" y="907" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Set availability and manage assigned deliveries.</text><text x="138" y="930" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">View customer details and submit delivery proof.</text><line x1="700" y1="232" x2="1220" y2="232" stroke="#D6D9D5" stroke-width="2"/><text x="700" y="260" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">06</text><text x="748" y="260" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Online Payments &amp; Cash on Delivery</text><text x="748" y="291" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">QRPH checkout uses PayMongo.</text><text x="748" y="314" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">COD collections follow the order payment record.</text><line x1="700" y1="386" x2="1220" y2="386" stroke="#D6D9D5" stroke-width="2"/><text x="700" y="414" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">07</text><text x="748" y="414" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">GPS Delivery Tracking</text><text x="748" y="445" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Use delivery-specific rider GPS locations.</text><text x="748" y="468" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Customer view uses live updates, polling and road routes.</text><line x1="700" y1="540" x2="1220" y2="540" stroke="#D6D9D5" stroke-width="2"/><text x="700" y="568" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">08</text><text x="748" y="568" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Membership &amp; Loyalty Rewards</text><text x="748" y="599" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Pay for membership and view points balance.</text><text x="748" y="622" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Earn and redeem points; fulfill rewards.</text><line x1="700" y1="694" x2="1220" y2="694" stroke="#D6D9D5" stroke-width="2"/><text x="700" y="722" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">09</text><text x="748" y="722" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Promotions &amp; Product Management</text><text x="748" y="753" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Configure promo codes and scheduled product discounts.</text><text x="748" y="776" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Manage banners, best sellers and home promos.</text><line x1="700" y1="848" x2="1220" y2="848" stroke="#D6D9D5" stroke-width="2"/><text x="700" y="876" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">10</text><text x="748" y="876" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Notifications &amp; Customer Support</text><text x="748" y="907" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">In-app and FCM notifications, support conversations,</text><text x="748" y="930" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">and assigned rider-customer chat.</text><line x1="1310" y1="232" x2="1830" y2="232" stroke="#D6D9D5" stroke-width="2"/><text x="1310" y="260" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">11</text><text x="1358" y="260" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Shop Operating Hours</text><text x="1358" y="291" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Admin sets the schedule and customers see it in app.</text><text x="1358" y="314" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Laravel checks hours for new online orders.</text><line x1="1310" y1="386" x2="1830" y2="386" stroke="#D6D9D5" stroke-width="2"/><text x="1310" y="414" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">12</text><text x="1358" y="414" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Staff Shift &amp; Cash Reconciliation</text><text x="1358" y="445" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Open with a cash fund; close with actual cash counted.</text><text x="1358" y="468" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">System calculates balance, shortage or excess.</text><line x1="1310" y1="540" x2="1830" y2="540" stroke="#D6D9D5" stroke-width="2"/><text x="1310" y="568" font-family="Aptos,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D676A">13</text><text x="1358" y="568" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" fill="#20272D">Reports &amp; Printable Records</text><text x="1358" y="599" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Admin sales, product, rider and customer reports.</text><text x="1358" y="622" font-family="Aptos,Arial,sans-serif" font-size="14.5" fill="#68747A">Printable staff and admin shift-closing reports.</text><line x1="80" y1="1032" x2="1840" y2="1032" stroke="#D6D9D5" stroke-width="2"/><text x="80" y="1060" font-family="Aptos,Arial,sans-serif" font-size="13" fill="#68747A">Verified against Laravel routes, controllers, models, migrations and Flutter screens</text><text x="1840" y="1060" text-anchor="end" font-family="Aptos,Arial,sans-serif" font-size="13" font-weight="700" fill="#68747A">KJM COFFEE SHOP</text></svg>