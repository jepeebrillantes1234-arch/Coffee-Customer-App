<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F5F4F0"/><path d="M0 0H1920V18H0Z" fill="#2D676A"/><text x="100" y="92" font-family="Aptos,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#2D676A">KJM COFFEE SHOP  |  SYSTEM DESIGN</text><text x="100" y="158" font-family="Aptos,Arial,sans-serif" font-size="49" font-weight="700" fill="#20272D">Implemented System Modules</text><text x="100" y="198" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#68747A">Feature summary based on current Laravel backend and Flutter customer/rider applications</text><text x="1818" y="104" text-anchor="end" font-family="Aptos,Arial,sans-serif" font-size="21" font-weight="600" fill="#68747A">SLIDE 12</text><line x1="960" y1="252" x2="960" y2="994" stroke="#D6D9D5" stroke-width="2"/><circle cx="123" cy="289" r="17" fill="#2D676A"/><text x="123" y="295" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">01</text><text x="157" y="296" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Authentication &amp; user management</text><text x="157" y="327" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Customer, staff, admin and rider roles; profile and account flows.</text><line x1="157" y1="347" x2="865" y2="347" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="123" cy="463" r="17" fill="#B9794A"/><text x="123" y="469" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">02</text><text x="157" y="470" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Admin dashboard</text><text x="157" y="501" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Orders, catalog, customers, riders, promotions, memberships and reporting.</text><line x1="157" y1="521" x2="865" y2="521" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="123" cy="637" r="17" fill="#2D676A"/><text x="123" y="643" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">03</text><text x="157" y="644" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Staff POS &amp; order operations</text><text x="157" y="675" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Walk-in/POS orders, order processing, reward verification and shift-gated access.</text><line x1="157" y1="695" x2="865" y2="695" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="123" cy="811" r="17" fill="#B9794A"/><text x="123" y="817" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">04</text><text x="157" y="818" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Product &amp; category management</text><text x="157" y="849" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Categories, products, options, images, availability and display ordering.</text><line x1="157" y1="869" x2="865" y2="869" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="271" r="17" fill="#2D676A"/><text x="1028" y="277" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">05</text><text x="1062" y="278" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Customer ordering &amp; checkout</text><text x="1062" y="309" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Browse, cart, saved addresses, checkout preview, order history and tracking.</text><line x1="1062" y1="329" x2="1805" y2="329" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="394" r="17" fill="#B9794A"/><text x="1028" y="400" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">06</text><text x="1062" y="401" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Payments</text><text x="1062" y="432" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Cash/COD and online QRPH/card flows with Laravel payment verification.</text><line x1="1062" y1="452" x2="1805" y2="452" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="517" r="17" fill="#2D676A"/><text x="1028" y="523" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">07</text><text x="1062" y="524" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Rider assignment &amp; delivery tracking</text><text x="1062" y="555" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Online rider eligibility, GPS updates, road routing, live status and delivery proof.</text><line x1="1062" y1="575" x2="1805" y2="575" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="640" r="17" fill="#B9794A"/><text x="1028" y="646" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">08</text><text x="1062" y="647" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Membership, loyalty &amp; rewards</text><text x="1062" y="678" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Membership payments, points ledger, reward redemption and staff verification.</text><line x1="1062" y1="698" x2="1805" y2="698" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="763" r="17" fill="#2D676A"/><text x="1028" y="769" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">09</text><text x="1062" y="770" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Notifications &amp; support</text><text x="1062" y="801" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">In-app/FCM notifications, customer support and order-linked rider chat.</text><line x1="1062" y1="821" x2="1805" y2="821" stroke="#D6D9D5" stroke-width="1.5"/><circle cx="1028" cy="886" r="17" fill="#B9794A"/><text x="1028" y="892" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">10</text><text x="1062" y="893" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="700" fill="#20272D">Shop hours, shifts &amp; printable records</text><text x="1062" y="924" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#68747A">Asia/Manila online ordering hours; opening fund, shift reconciliation and closing reports.</text><line x1="1062" y1="944" x2="1805" y2="944" stroke="#D6D9D5" stroke-width="1.5"/><line x1="100" y1="1037" x2="1820" y2="1037" stroke="#D6D9D5" stroke-width="2"/><text x="100" y="1067" font-family="Aptos,Arial,sans-serif" font-size="14" fill="#68747A">Scope note: operating hours use the existing settings key/value store; staff cash shifts use staff_shifts and orders.staff_shift_id.</text><text x="1820" y="1067" text-anchor="end" font-family="Aptos,Arial,sans-serif" font-size="14" fill="#68747A">Verified against implemented Laravel routes, models and migrations</text></svg>